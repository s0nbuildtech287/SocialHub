<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Main Brand Gradient (Amber -> Orange -> Rose) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Background Ambient Glow -->
  <circle cx="64" cy="64" r="36" fill="#f59e0b" opacity="0.12" filter="blur(16px)" />

  <!-- Connected Social Hub Network & Stylized 'S' Path -->
  <g filter="url(#glow)">
    <!-- Central Flowing S-Hub Path -->
    <path d="M 84 40 C 84 32, 74 28, 64 28 C 48 28, 40 38, 40 48 C 40 68, 88 60, 88 80 C 88 92, 76 100, 64 100 C 50 100, 44 94, 44 86" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Network Satellite Nodes (Hub endpoints) -->
    <!-- Top-Right Node (e.g. Facebook) -->
    <circle cx="84" cy="40" r="7.5" fill="#fbbf24" stroke="#090d16" stroke-width="2.5" />
    <!-- Bottom-Left Node (e.g. TikTok) -->
    <circle cx="44" cy="86" r="7.5" fill="#f43f5e" stroke="#090d16" stroke-width="2.5" />
    
    <!-- Central Nexus Pulse Node (The Hub Core) -->
    <circle cx="64" cy="64" r="6" fill="#ffffff" stroke="#f97316" stroke-width="3" />

    <!-- Radiating Connection Beams -->
    <line x1="64" y1="64" x2="96" y2="64" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />
    <circle cx="96" cy="64" r="4.5" fill="#f97316" />

    <line x1="64" y1="64" x2="32" y2="64" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />
    <circle cx="32" cy="64" r="4.5" fill="#fbbf24" />
  </g>
</svg>
